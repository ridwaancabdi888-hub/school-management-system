<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Website</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body{background:#fff}
  .site-nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);z-index:20;padding:14px 0}
  .site-nav .container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .site-nav .links{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;font-weight:600}
  .site-nav .links a{color:var(--text)}
  .hero{padding:60px 0;text-align:center;color:#fff}
  .hero h1{font-size:clamp(28px,5vw,44px);margin-bottom:10px}
  .hero p{font-size:16px;max-width:600px;margin:0 auto 20px;opacity:.95}
  section{padding:44px 0;border-bottom:1px solid var(--border)}
  section h2{font-size:24px;margin-bottom:16px}
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .gallery-grid img{width:100%;height:120px;object-fit:cover;border-radius:8px}
  footer{padding:24px 0;text-align:center;color:var(--text-muted);font-size:13px}
</style>
</head>
<body>
  <div id="app"><div class="loading">Loading school website...</div></div>
  <script src="/js/api.js"></script>
  <script src="/website/app.js"></script>
</body>
</html>
